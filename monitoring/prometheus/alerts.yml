---
groups:
  - name: server_alerts

    rules:

      - alert: InstanceDown
        expr: up == 0
        for: 1m

        annotations:
          summary: "Host caído"

      - alert: HighCPU
        expr: 100 - (avg by(instance)(rate(node_cpu_seconds_total{mode="idle"}[2m])) * 100) > 80
        for: 2m

        annotations:
          summary: "CPU alta"

      - alert: HighMemory
        expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100 > 90
        for: 2m

        annotations:
          summary: "Memoria alta"
