name: DevOps Lab CI

on:
    push:
        branches:
        - main
        
    pull_request:
        branches:
        - main

jobs:

    validate:
        runs-on: Checkout repository
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
            
            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                python-version: '3.12'

            - name: Install Ansible
              run: |
                python -m pip install --upgrade pip
                pip install ansible
            
            - name: Validate Python Scripts
              run: |
                python -m py_compile scripts/generate_inventory.py
                python -m py_compile scripts/labctl.py

            - name: Validate Ansible Site
              run: |
                ansible-playbook --syntax-check site.yml
            
            - name: Validate Docker Compose
              run: |
                docker-compose config