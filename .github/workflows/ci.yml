---
name: DevOps Lab CI

'on':
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  validate:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Python Lint
        run: |
          flake8 scripts

      - name: YAML Lint
        run: |
          yamllint .

      - name: Ansible Lint
        run: |
          ansible-lint ansible/site.yml

      - name: Validate Python Scripts
        run: |
          python -m py_compile scripts/generate_inventory.py
          python -m py_compile scripts/labctl.py

      - name: Test Labctl Help
        run: |
          python scripts/labctl.py help

      - name: Validate Ansible Site
        run: |
          ansible-playbook --syntax-check ansible/site.yml

      - name: Validate Docker Compose
        run: |
          docker compose config

  security:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Scan Grafana
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: grafana/grafana:latest
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true #Evita errores que no podemos controlar.

      - name: Scan Prometheus
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: prom/prometheus:latest
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true

      - name: Scan Alertmanager
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: prom/alertmanager:latest
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
